default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: commitizen
        name: commitizen check
        entry: uv run python -m commitizen check --commit-msg-file
        language: system
        stages: [commit-msg]
        