[project]
name = "productivity-study-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tetiana Velehura", email = "velegura00@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
productivity-study-system = "productivity_study_system:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "commitizen>=4.19.2",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "rust-just>=1.59.0",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
